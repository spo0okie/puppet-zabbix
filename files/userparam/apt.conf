# Файл: /etc/zabbix/zabbix_agent2.d/apt_updates.conf
# (для zabbix_agentd: /etc/zabbix/zabbix_agentd.d/apt_updates.conf)
#
# Требования на хосте:
#   apt-get, grep, wc — присутствуют в базовой установке Debian
#   Пользователь zabbix должен иметь право запускать apt-get -s (симуляция, без root)

# Количество пакетов, ожидающих обновления.
# apt-get -s upgrade: симуляция без реальной установки, не требует root.
# Строки вида "Inst <pkg> ..." — каждый пакет к обновлению.
UserParameter=apt.upgrades.pending,apt-get -s upgrade 2>/dev/null | grep -c '^Inst'

# Флаг необходимости перезагрузки: 1 — файл существует, 0 — нет.
# Файл создаётся пакетами (через /usr/share/update-notifier/notify-reboot-required
# или аналогами) при установке ядра и других компонентов, требующих перезагрузки.
UserParameter=apt.reboot.required,test -f /var/run/reboot-required && echo 1 || echo 0

# Список пакетов, потребовавших перезагрузки (одна строка через запятую).
# Если файл отсутствует — возвращает пустую строку.
UserParameter=apt.reboot.packages,test -f /var/run/reboot-required.pkgs && tr '\n' ',' < /var/run/reboot-required.pkgs | sed 's/,$//' || echo ''
